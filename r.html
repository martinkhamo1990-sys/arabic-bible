  <link rel="stylesheet" href="css/style.css?v=5">
  <script>window.NOTES_DATA = {"jhn":{"1":{"1":"الكلمة هنا هو الابن، يسوع المسيح، لا مجرد صوت أو كلام. كان منذ الأزل عند الآب، وهو الله، لا إلهًا ثانيًا بجانب الله. فالكتاب يعلن إلهًا واحدًا، والابن واحد مع الآب في الجوهر ومتميز عنه في شخصه. لذلك نسجد ليسوع ونثق به وحده للخلاص.","3":"كل ما وُجد، وُجد بالكلمة. فلو كان الابن مخلوقًا لما صح أن يقال إن كل شيء به كان. هو الخالق لا جزء من الخليقة. هذا يحفظ كرامة المسيح كما يعلنها الكتاب، ويرد كل قول يجعله أقل من الله.","14":"الأزلي الذي هو الله صار إنسانًا حقيقيًا وسكن بين الناس. لم يتحول عن كونه الله، بل أخذ جسدًا فصار لنا أخًا ووسيطًا. مجده الذي رآه التلاميذ مجد الابن الوحيد من الآب، مملوءًا نعمة وحقًا. الخلاص جاء به شخصًا، لا بفكرة ولا بطقس.","18":"لا أحد رأى الله في كماله، والابن الوحيد الذي في حضن الآب هو الذي أخبر عنه. يسوع يعرّفنا بالله لأنه منه ومنذ الأزل عنده. ليست هناك واسطة أخرى تكشف الآب. من أراد أن يعرف الله فليسمع للابن."},"3":{"3":"الولادة من فوق عمل يعمله الله، لا تحسين أخلاق يصنعه الإنسان بنفسه. من دون هذه الولادة لا يرى أحد ملكوت الله، مهما كان دينه أو أصله. يسوع يقول هذا لمعلم في إسرائيل، فالمعرفة وحدها لا تكفي. الملكوت يُدخل إليه بالنعمة التي تجدّد القلب.","5":"يسوع يكلم نيقوديموس عن الولادة من فوق، لا عن طقس يُجريه الناس. الماء والروح يشيران إلى التطهير والحياة الجديدة التي وعد الله أن يعطيها بروحه. دخول الملكوت ليس بماء يُسكب على من لم يؤمن، بل بميلاد يعمله الروح. والآية السابقة تجعل الشرط أن يولد الإنسان من فوق، وهذا عطية لا أجر.","16":"هذه الآية تجمع البشارة: الله أحب العالم فوهب ابنه، لا لأن العالم استحق ذلك. الحياة الأبدية ليست ثمن أعمال ولا ثمن طقوس، بل عطية لكل من يؤمن بالابن. والدعوة ليست لشعب واحد، فكل من يؤمن، من أي أمة، لا يهلك بل يحيا. الهلاك لمن يرفض الابن، لا لمن لم يكمل طقسًا."},"5":{"24":"من يسمع كلام المسيح ويؤمن بالذي أرسله فله حياة أبدية الآن، لا مجرد رجاء غامض. يسوع يقول إنه لا يأتي إلى دينونة الهلاك، بل قد انتقل من الموت إلى الحياة. هذا الانتقال بالإيمان، لا بعمل نضيفه إلى الصليب. من صدق الابن يقدر أن يطمئن إلى وعده."},"6":{"53":"يسوع يتكلم بصورة قوية عن أخذ حياته لأنفسنا. الأكل والشرب هنا ليسا مضغ جسد مادي، لأنه يقول بعد قليل إن الجسد لا يفيد شيئًا وإن الروح هو الذي يحيي. المعنى أن نقبل موته لأجلنا بالإيمان فنحيا. من يرفض الاتكال على جسده المبذول ودمه المسفوك يبقى بلا هذه الحياة.","54":"من يأكل جسد المسيح ويشرب دمه، أي من يؤمن به مصلوبًا لأجله، فله حياة أبدية. يسوع هو الذي يقيمه في اليوم الأخير، فالرجاء منه لا من استحقاق الآكل. الكلام لا يصف خبزًا يتحول على مائدة إلى جسد يُعاد تقديمه. الحياة عطية حاضرة لمن يثبت على الإيمان به.","55":"قوله إن جسده مأكل حق ودمه مشرب حق يعني أنه الغذاء الحقيقي للنفس. الحق هنا مقابل الطعام الذي يفنى، لا تحول الخبز والخمر في جوهرهما. نشبع حين نثق بالمسيح نفسه. طقس بلا إيمان لا يطعم أحدًا حياة أبدية.","56":"الثبوت في المسيح وثبوته فينا شركة بالإيمان، لا امتزاج جسدي بمادة الخبز. من يقبل المسيح يحيا فيه، والمسيح يحيا فيه بالروح. هذه الشركة عطية لكل من يؤمن من أي شعب، لا امتياز طقس مغلق على جماعة. الثبوت يظهر في الثقة والطاعة، وهو ثمر الحياة لا ثمنها.","63":"هذه الآية مفتاح كلام يسوع عن الأكل والشرب. الروح هو الذي يحيي، أما الجسد فلا يفيد شيئًا، وكلام المسيح روح وحياة. فنقبل كلامه بالإيمان لا بمحاولة جسدية. لذلك لا يُفهم الأصحاح على أن الخلاص يتم بتحول الخبز، بل بقبول الابن الذي يتكلم."},"8":{"58":"يسوع لا يقول فقط إنه وُجد قبل إبراهيم، بل يقول: أنا كائن، بصيغة تذكّر باسم الله «أهيه». اليهود فهموا أنه ينسب لنفسه ما لله، لذلك أرادوا رجمه. الابن كان قبل إبراهيم لأنه الأزلي لا لأنه مخلوق أول. هذا الإقرار من فم المسيح نفسه، والكتاب هو الحكم فيه."},"10":{"28":"يسوع يعطي خرافه حياة أبدية، ويقول إنها لن تهلك وإن أحدًا لا يخطفها من يده. الحفظ من قوته لا من كمال ثباتنا. هذا لا يبيح الاستهانة بالخطية، فالمؤمن يحب الذي خلصه ويسلك وراءه. لكنه يطمئن: من كان حقًا للمسيح محفوظ بنعمته إلى النهاية.","30":"قوله «أنا والآب واحد» وحدة في الجوهر والعمل، لا إنكار أنهما شخصان. يسوع لا يجعل نفسه مخلوقًا قريبًا من الله، فالسامعونه همّوا برجمه لأنه جعل نفسه إلهًا. نؤمن بإله واحد، والآب والابن واحد فيه بلا اختلاط للأشخاص. هكذا نعبد الابن كما نعبد الآب."},"14":{"6":"يسوع لا يقول إنه طريق من بين طرق، بل إنه الطريق والحق والحياة. ليس أحد يأتي إلى الآب إلا به، لا بطقوس ولا بصلاحنا ولا بوسيط آخر. هذا ليس قسوة، بل رحمة: الله فتح بابًا صادقًا واحدًا لكل الناس. من أي أمة كان الإنسان، فالإيمان بيسوع هو المجيء إلى الآب.","9":"من رأى يسوع فقد رأى الآب، لأن الابن يظهر الآب ظهورًا كاملًا. ليس المعنى أن الآب والابن شخص واحد بلا تمييز، فيسوع يقول أيضًا إنه ماض إلى الآب. المعنى أن الله الذي لا يُرى يُعرف في الابن المتجسد. لذلك لا نطلب طريقًا إلى الله يتخطى المسيح.","28":"قوله «أبي أعظم مني» يُقال وهو ماض إلى الآب في طريق الصليب والطاعة. الابن في تجسده أخذ مقام العبد المرسل، فالآب أعظم في ترتيب الإرسال لا في جوهر ألوهية أقل. يسوع نفسه قال إنه والآب واحد. فالآية لا تجعل الابن إلهًا أصغر، بل تبرز تواضعه."},"17":{"3":"الحياة الأبدية أن نعرف الآب الإله الحقيقي، ويسوع المسيح الذي أرسله. ذكر الآب وحده إلهًا حقًا لا ينفي لاهوت الابن، فالسياق صلاة الابن الذي له مجد عند الآب قبل العالم. المعرفة هنا ثقة وطاعة، لا معلومة تُحفظ. والحياة في هذه المعرفة عطية، لا نتيجة أعمال نجمعها."},"19":{"30":"قوله «قد أُكمل» يعني أن عمل الفداء تم على الصليب. الدين سُدّد، والذبيحة كملت، فلم يبقَ للمؤمن أن يكملها بعمل أو بإعادة تقديم المسيح. نذكر موته بالشكر والإيمان، ولا نعيد صلبه في طقس. الراحة عند الله هي أن نصدق أن العمل قد تم."},"20":{"23":"يسوع يرسل التلاميذ ليعلنوا الغفران باسمه بسلطان الإنجيل. من تاب وآمن تُقال له كلمة الغفران حقًا، ومن رفض يُمسك عليه لأنه رفض الغافر. ليس المعنى أن إنسانًا يغفر بقرار منه بمعزل عن التوبة والإيمان بالمسيح. الكنيسة تَخدم كلمة الغفران، والمسيح هو الذي يغفر.","28":"توما يدعو يسوع ربي وإلهي، ويسوع يقبل هذا ولا يرده. التلميذ الذي شك صار شاهدًا أن المصلوب القائم هو الرب الإله. هذه العبادة توافق أول الأصحاح: الكلمة كان الله. نأتي إلى المسيح مثل توما، بالإيمان لا بالنظر، ونسجد له."}},"mat":{"1":{"23":"متى يفسر اسم عمانوئيل: الله معنا. الحبل هو من عذراء، بعمل الروح لا بزواج، والابن المولود هو الله الحاضر مع شعبه. هذا يتم وعدًا أشار إليه إشعياء، ويكشفه الإنجيل بوضوح. الإيمان بالمسيح يبدأ من هذا: الإله صار معنا ليخلص."},"3":{"11":"معمودية يوحنا بالماء علامة على التوبة وتهيئة للآتي بعده. يوحنا نفسه يفرق بين غمسه في الماء وبين عمل المسيح الذي يغمس في الروح القدس. الماء لا يغني عن المسيح ولا يلد القلب. التوبة تتجه إلى الشخص الأقوى، وهو الذي يمنح الروح.","16":"يسوع خرج من الماء، فالمعمودية هنا نزول وطلوع يناسب الغمر. وهو بلا خطية اعتمد ليتم كل بر ويظهر طاعته أمام الناس. في اللحظة نفسها نزل روح الله عليه كأنه حمامة، وجاء صوت الآب: هذا ابني الحبيب. الآب والابن والروح ظاهرون معًا، وإلهنا واحد لا ثلاثة آلهة."},"5":{"17":"يسوع لم يأتِ ليلغي الناموس والأنبياء كأن كتبهم سقطت. جاء ليكملها، أي ليتم قصدها فيه وفي تعليمه. الكتاب كله يبقى كلمة الله ومرجعه الأخير. لكن البر أمام الله ليس بجمع أعمال الناموس، بل بالمسيح الذي أكمله، ومن آمن به يسلك بما يرضي الرب."},"7":{"21":"ليس كل من يقول يا رب يدخل الملكوت. إرادة الآب التي يقصدها يسوع هي أن نقبل الابن ونطيعه، لا أن نشتري السماء بأعمال. اعتراف اللسان بلا إيمان حي خداع للنفس. والأعمال لا تفتح الباب، لكنها تظهر إن كان القلب قد خضع حقًا للرب."},"16":{"18":"الصخرة التي تُبنى عليها الكنيسة هي الإقرار أن يسوع هو المسيح ابن الله الحي، والمسيح نفسه أساس شعبه. بطرس حجر، وكان أول من نطق بهذا بين التلاميذ، لكنه ليس رأسًا معصومًا يملك الكنيسة. أبواب الجحيم لن تقوى عليها لأن المسيح يحفظها، لا لأن في البشر سلطة لا تخطئ. المرجع الأخير هو كلمة الله، والرب هو يسوع.","19":"مفاتيح الملكوت أمانة الإنجيل: يُفتح الباب بالتوبة والإيمان، ويُعلن الإغلاق على من يرفض. الربط والحل إعلان ما قد حكم به الله، لا سلطة تغير حكمه. وفي الأصحاح الثامن عشر تُعطى هذه الأمانة لجماعة التلاميذ لا لشخص واحد فوق الكنيسة. لا يفتح السماء طقس، بل كلمة المسيح مقبولة بالإيمان."},"18":{"18":"الكلام هنا للجماعة، فالفعل بصيغة الجمع: ما تربطونه وتحلونه. الكنيسة تؤدب بكلمة الله، فتقول للتائب إن الغفران يشمله، وتقول للمصر على رفض التوبة إن الخطية ممسكة عليه. هذا ليس سلطانًا مستقلًا عن الكتاب. السماء لا تتبع حكم البشر، بل الكنيسة تشهد لحكم الله."},"19":{"4":"يسوع يرجع بالزواج إلى البدء، لا إلى عادات الناس. الذي خلق، خلق الإنسان ذكرًا وأنثى، فهذا هو تصميمه للزوجين. لا نملك أن نعيد تعريف ما قاله الخالق في كلمته. الكلمة هي المرجع، وهي تكرم الرجل والمرأة معًا على صورة الله.","6":"الزواج في قصد الله اتحاد رجل واحد بامرأة واحدة، فيصيران جسدًا واحدًا. الذي جمعه الله لا يفرقه الإنسان بهوى أو بعادة. يسوع يرد سامعيه إلى هذا الأصل لا إلى قساوة القلب. نكرم هذا العهد ونرحم المكسورين، من غير أن نبدل كلام الخالق."},"26":{"26":"يسوع يقول عن الخبز: هذا هو جسدي، كما يقول في موضع آخر إنه الكرمة. الخبز علامة عهد تشير إلى جسده المبذول، لا جسدًا يُصنع من جديد كل مرة. التلاميذ أكلوا وهو بعد حي بينهم، فالمعنى علامة لا ذبيحة تتكرر. نأخذ الخبز ذكرى لموته وشكرًا بالإيمان.","28":"الكأس تشير إلى دمه الذي للعهد الجديد، المسفوك لمغفرة الخطايا. المغفرة من سفك دمه مرة على الصليب، لا من تكرار ذبيحة. كلمة كثيرين لا تغلق الدعوة، فالبشارة لكل الأمم، ومن يؤمن ينال هذه المغفرة. نشرب شاكرين لأن الثمن دفعه هو لا أعمالنا."},"28":{"19":"يسوع يرسل تلاميذه إلى جميع الأمم، فالبشارة ليست لشعب واحد. الطريق هو التلمذة ثم المعمودية: يُعتمد من صار تلميذًا، باسم الآب والابن والروح القدس. الاسم الواحد مع الثلاثة يعلن إلهًا واحدًا، والآب والابن والروح في هذه الرسالة معًا. المعمودية طاعة للمتلمذين المؤمنين، لا طقس يخلّص بلا إيمان."}},"mrk":{"16":{"16":"الآية تجمع الإيمان والمعمودية في طريق التلميذ، لكن الدينونة تقع على من لم يؤمن لا على من لم يُعتمد. اللص على الصليب نال الوعد بالإيمان من غير معمودية. فالذي يخلّص هو الإيمان بالمسيح، والمعمودية خطوة الطاعة التي تشهد له. من آمن يُدعى أن يعتمد، ومن رفض الإيمان يبقى تحت الدينونة."}},"luk":{"1":{"35":"الحبل بيسوع عمل الروح القدس وقوة العلي، لا تدخل إنسان. لذلك يُدعى المولود قدوسًا وابن الله، لا ابنًا بالتبني فقط بعد حين. مريم مكرمة لأنها آمنت وولدت الرب، والمخلص هو ابنها لا هي. التجسد نعمة إلهية، وهو أساس اتكالنا على المسيح."},"22":{"19":"يسوع يقول إن الخبز جسده الذي يبذل عنا، ثم يأمر: اصنعوا هذا لذكري. الذكرى إعلان لموته وشكر، لا إعادة ذبيحة على مائدة. الجسد بُذل مرة على الصليب لأجل الخطاة. المؤمنون يأكلون بالإيمان ذلك البذل، ولا ينتظرون أن يتحول الخبز إلى جسد يُقدم من جديد."},"23":{"43":"اللص لم يعتمد ولم يقدم أعمالًا، ومع ذلك قال له يسوع إنه اليوم يكون معه في الفردوس. هذا يبين أن الخلاص بالثقة بالمسيح لا بالأسرار ولا بالأعمال. المعمودية تبقى أمر الرب لمن يؤمن ويقدر أن يطيع، لكنها ليست ثمن دخول الفردوس. النعمة تكفي من يلتجئ إلى يسوع ولو في الساعة الأخيرة."},"24":{"47":"المسيح القائم يأمر أن يُكرز باسمه بالتوبة ومغفرة الخطايا لجميع الأمم. المغفرة مربوطة باسمه لا بأسمائنا ولا ببر أعمالنا. والبداية من أورشليم ثم إلى كل الشعوب، فالإنجيل ليس ملك شعب واحد. التوبة والإيمان هما جواب الإنسان على هذه الكرازة."}},"act":{"2":{"38":"بطرس يدعو إلى التوبة والمعمودية باسم يسوع المسيح. مغفرة الخطايا بالرجوع إلى المسيح والإيمان باسمه، وهو نفسه يقول لاحقًا إن كل من يؤمن به ينال الغفران. المعمودية أمر الرب للمؤمن وإعلان علني لإيمانه، لا طقسًا يلد القلب بذاته. وفي بيت كرنيليوس حل الروح على الذين سمعوا وآمنوا قبل أن يعتمدوا، فالروح عطية الله لا أجر الماء.","39":"الموعد لكم ولأولادكم ولكل الذين على بعد، أي للجيل الآتي وللأمم البعيدة. والآية تختم بمن يدعوه الرب، فلا يدخل أحد العهد بلا دعوة الله وجواب الإيمان. الأولاد محبوبون ويُبشرون، ويُعتمدون حين يؤمنون لا قبل الإيمان نيابة عنهم. رحمة الله واسعة، والخلاص شخصي بالنعمة."},"4":{"12":"الخلاص ليس بأحد غير يسوع. لا اسم آخر تحت السماء أُعطي بين الناس به ينبغي أن نخلص، لا اسم قديس ولا طقس ولا جهد. هذا يشمل كل البشر، فليس لأمة طريق مختلف. الكرازة بهذا الاسم واجب محبة لا احتقار للناس."},"8":{"37":"فيلبس يشترط الإيمان من كل القلب قبل المعمودية. اعتراف الخصي أن يسوع المسيح هو ابن الله هو جواب الإيمان، لا معلومة تقال بلا ثقة. المعمودية تتبع هذا الإيمان ولا تسبقه ولا تغني عنه. هكذا نرى الترتيب: يُؤمن الإنسان أولًا، ثم يُعتمد.","38":"نزل فيلبس والخصي كلاهما إلى الماء، ثم عمده. الصورة نزول إلى الماء تليق بالغمر، وهي معمودية من قد آمن كما في الآية السابقة. لم يُعتمد طفل بلا إيمان، ولا اكتُفي برش بعيد عن الماء. هذا هو نمط العهد الجديد: مؤمن ينزل إلى الماء شاهدًا للمسيح."},"10":{"43":"جميع الأنبياء يشهدون أن كل من يؤمن بيسوع ينال باسمه غفران الخطايا. الغفران هنا مربوط بالإيمان باسمه، لا بعمل يُضاف ولا بانتماء إلى شعب. كلمة كل من تفتح الباب للأمم كما لليهود. وبعد هذه الكلمة حل الروح على السامعين قبل معموديتهم، فالله قبل إيمانهم."},"16":{"31":"الخلاص هنا بالأمر الواضح: آمن بالرب يسوع المسيح. الكلام عن أهل البيت لا يعني أن إيمان الرجل يُحسب برًا للباقين وهم لم يؤمنوا. الكلمة وُجهت إلى جميع من في البيت، والمعمودية تبعت سماعها. كل واحد يخلص بالإيمان الشخصي بالمسيح، لا بمجرد السكنى في بيت مؤمن."},"22":{"16":"الغسل مربوط في الآية بدعاء اسم الرب، أي بالالتجاء إليه. الماء لا يمحو الخطية كأنه يحمل قوة في نفسه، بل المعمودية تعلن أن المؤمن دعا الرب الذي وحده يغسل. بولس كان قد لقي الرب وآمن قبل أن يُقال له قم واعتمد. الخلاص نعمة لمن يدعو، والمعمودية طاعة تتبع هذا الدعاء."}},"rom":{"1":{"16":"بولس لا يخجل من بشارة المسيح لأنها قدرة الله للخلاص. الخلاص لكل مؤمن، لليهودي أولًا ثم لليوناني، أي لكل الأمم. ليست القدرة في فصاحة المتكلم ولا في أعمال السامع. من يؤمن بالمسيح يخلص، والدعوة تمضي إلى كل إنسان.","17":"في البشارة يعلن الله بره، أي كيف يبرر الخطاة. الطريق إيمان من أوله إلى آخره، كما كُتب أن البار يحيا لأنه يؤمن. البر هنا عطية الله لا نتيجة أعمال نجمعها. لذلك لا نخجل من إنجيل نعمة يُقدم لكل الشعوب."},"3":{"24":"بعد أن قال إن الكل أخطأ، يقول إن التبرير مجانًا بنعمة الله بالفداء الذي في يسوع المسيح. مجانًا تعني أنه ليس أجرًا ولا ثمن طقس. الفداء تم في المسيح، والمؤمن يُحسب بارًا لأجل ذلك. هذا يقطع الافتخار، ويفتح الرجاء لكل خاطئ يؤمن.","28":"النتيجة التي يصل إليها بولس أن الإنسان يُبرر بالإيمان لا بأعمال الشريعة. أعمال الشريعة لا تُلغى بوصفها هدى للحياة، لكنها ليست أساس القبول عند الله. إن أضفنا الأعمال ثمنًا للبر أفرغنا الإيمان من معناه. القبول نعمة، والطاعة تأتي بعده شكرًا."},"4":{"5":"الله يبرر الفاجر الذي لا يتكل على عمله بل يؤمن. هذا يفاجئ المتدين: البر يُحسب بالإيمان لا يُدفع بالأعمال. ليس في هذا إذن بالبقاء في الفجور، فالأصحاح السادس يرفض ذلك. فيه رجاء لمن يعرف أنه فاجر: يقدر أن يأتي إلى المسيح الآن."},"6":{"3":"الاعتماد للمسيح يعني الاتحاد به في موته، لا نيل الخلاص من الماء بمعزل عن الإيمان. من هو في المسيح اشترك في معنى موته عن الخطية. المعمودية ترسم هذا الاتحاد لمن آمن، ولا تخلقه وحدها. الصورة تخدم الإنجيل ولا تحل محله.","4":"الدفن في المعمودية صورة للموت مع المسيح، والخروج منها صورة للحياة الجديدة. كما أُقيم المسيح بمجد الآب، المؤمن مدعو أن يسلك في جدة الحياة. الطقس لا يصنع القيامة في القلب، بل يعلن ما عمله الله فيمن يؤمن. لذلك المعمودية للمؤمنين الذين ماتوا مع المسيح بالإيمان، وهي بالغمر الذي يشبه الدفن."},"8":{"29":"الذين سبق فعرفهم الله سبق فعينهم ليصيروا مشابهين صورة ابنه. المعرفة السابقة هنا قصد الله الشخصي ومحبته، لا مجرد اطلاع على ما سنختاره بقوتنا. الغاية أن يكرم الابن في إخوة كثيرين. هذا يواضعنا: البداية من الله، والغاية شبه المسيح لا افتخارنا.","30":"السلسلة واحدة: من عينهم دعاهم، ومن دعاهم بررهم، ومن بررهم مجدهم. الله يتمم ما بدأ، فالتبرير لا يسقط في الطريق عند من هم حقًا له. هذا لا يلغي الكرازة، فالله يدعو بالإنجيل. وهو يمنع اليأس: الذي برره الله سيبلغ به المجد."},"9":{"11":"قبل أن يولد الولدان وقبل أن يعملا خيرًا أو شرًا، أثبت الله قصده في الاختيار. الاختيار ليس بسبب الأعمال بل بسبب الذي يدعو. بهذا يسقط الافتخار بالولادة أو بالجهد. وهو لا يلغي دعوة الناس إلى الإيمان، بل يبين أن الخلاص يبدأ من الله الرحيم.","13":"«أحببت يعقوب وأما عيسو فرفضته» يبين أن الوعد ليس بالانتساب إلى إبراهيم تلقائيًا ولا بالأعمال. الله يختار بحسب رحمته، كما يشرح بولس في السياق، والرفض حكم عادل لا عبث. ومع هذا تبقى الدعوة في الأصحاح العاشر: كل من يدعو باسم الرب يخلص. لا نستخدم الآية لنغلق الإنجيل عن أحد.","16":"الأمر لا يتوقف على إرادة الإنسان ولا على سعيه كأنه أجر يُستحق. يتوقف على الله الذي يرحم. هذا لا يعني أن نتوقف عن دعوة الناس، فالله يرحم من خلال البشارة. يعني أن لا نفتخر: من آمن فبرحمة الله آمن. السعي الصالح يأتي بعد الرحمة ولا يشتريها.","18":"الله يرحم من يشاء ويقسي من يشاء، وهو في هذا بار. تقسية فرعون جاءت مع كبرياء قاوم كلمة الله، فلم يُظلم. الرحمة لا يستحقها أحد، فمن نالها فليحمد، ومن يسمع الإنجيل فليأتِ. هذه الآية لا تلغي قول الكتاب إن كل من يدعو باسم الرب يخلص."},"10":{"9":"الخلاص مشروط هنا بالاعتراف أن يسوع رب وبالإيمان القلبي أن الله أقامه من الأموات. لا ذكر لعمل يُضاف ثمنًا ولا لطقس يكمل النقص. الربوبية تعني الخضوع ليسوع لا مجرد لقب. هذا الإيمان مفتوح لكل من يسمع، وهو طريق الخلاص الواحد.","13":"كل من يدعو باسم الرب يخلص. كلمة كل من لا تستثني شعبًا ولا طبقة. الدعاء باسم الرب هو الالتجاء إليه بالإيمان، لا ترديد حروف بلا ثقة. الآية تُقرأ مع ما قبلها: الإيمان من السماع، والسماع بكلمة المسيح. لذلك نبشر كل الناس ولا نضيق الرحمة."},"11":{"6":"إن كان الخلاص بالنعمة فليس بالأعمال، وإلا لم تعد النعمة نعمة. لا يُخلط الثمنان: إما عطية وإما أجر. الأعمال الصالحة ثمر لمن نال النعمة، لا سبب لينالها. هذا يحفظ الإنجيل من أن يعود برًا بالأعمال تحت اسم آخر."}},"1co":{"1":{"17":"بولس لا يحتقر المعمودية، فقد عمد بعض المؤمنين. لكنه يوضح أن المسيح أرسله ليبشر لا ليجعل المعمودية هي البشارة. قوة الله في صليب المسيح لا في بلاغة ولا في طقس منفصل عن الإيمان. إن صارت المعمودية بدل الإنجيل تعطّل معنى الصليب."},"6":{"9":"الآية تحذر أن الظالمين لا يرثون ملكوت الله، وتسمي خطايا منها الزنى والعلاقات الجنسية بين الذكور. قصد الله الذي لا يتبدل هو زواج رجل واحد بامرأة واحدة، وكل ما خرج عن ذلك خطية. هذا ليس احتقارًا لأشخاص، فالآية التالية تقول إن بعض المؤمنين كانوا كذلك ثم اغتسلوا وتبرروا باسم يسوع. الخلاص نعمة تغير، ولا يُشترى بالأعمال ولا يُستعمل سلاحًا لإهانة الناس."},"10":{"16":"كأس البركة والخبز المكسور شركة في دم المسيح وجسده. الشركة اتحاد إيمان مع الرب ومع الإخوة، لا تحول الخبز والخمر إلى جسد ودم ماديين. بولس يقارن هذا بمائدة الأوثان: المشاركة علامة ولاء. مائدة الرب للمؤمنين نعمة وشكر، لا عملًا سحريًا."},"11":{"24":"يسوع يقول عن الخبز: هذا جسدي وهو لأجلكم، ثم: افعلوا هذا ذكرًا لي. الذكرى إعلان وشكر لموته، لا إعادة للصليب. الجسد بُذل مرة، والمائدة تذكر الكنيسة بذلك. نأكل بالإيمان لا بثقة أن مادة الخبز تتغير.","25":"الكأس هي العهد الجديد بدم المسيح. كلما شرب المؤمنون يذكرون هذا الدم ولا يقدمون ذبيحة جديدة عن أحياء أو أموات. العهد جديد لأنه مختوم بموته، والقبول فيه بالنعمة لا ببر أعمالنا. المائدة تنتظر رجوعه، فهي لا تكمل فداءً ناقصًا.","26":"كلما أكلتم وشربتم تخبرون بموت الرب إلى أن يأتي. المائدة إعلان للصليب وانتظار للرجوع. إن كنا نخبر بموته فذبيحته قد تمت ولا تُعاد. المشاركة للمؤمنين إلى أن يروه، وهي شهادة لا طقس يخلّص غير المؤمن.","27":"الأكل بدون استحقاق هو تناول المائدة باستهتار، بلا إيمان ولا توبة، لا كون الإنسان غير كامل. من يفعل ذلك يستهين بمعنى جسد الرب ودمه، أي بموته. الاستحقاق ليس صلاحًا نجمعه حتى نستحق الكأس. المؤمن يمتحن قلبه ثم يأتي متواضعًا بالشكر، واثقًا أن الذبيحة كافية."},"15":{"3":"بولس يسلم في الأول ما تسلمه: المسيح مات من أجل خطايانا حسب الكتب. هذا هو الإنجيل، لا نصائح أخلاق تُضاف إليها. موته لأجل خطايانا نيابة، كما شهدت الكتب من قبل. نقبله بالإيمان، وهو لكل من يُبشر به لا لفئة وحدها.","29":"بولس لا يأمر أن يُعتمد أحد من أجل الأموات ولا بدلًا عنهم ليخلُصوا. يشير إلى ما يفعله بعض الناس ثم يسأل: إن لم تكن قيامة فلماذا يفعلون ذلك. الحجة على القيامة، لا تأسيس لطقس. معمودية العهد الجديد للمؤمن الحي الذي يعترف بالمسيح، والأموات لا يخلُصون بمعمودية غيرهم."}},"2co":{"5":{"21":"الله جعل الذي لم يعرف خطية، أي المسيح، خطية لأجلنا. المعنى أنه حمل دينونتنا ليُحسب لنا بر الله فيه. هذا تبادل نعمة لا صفقة أعمال. برنا أمام الله هو المسيح نفسه لمن يؤمن، لا رصيد نبنيه. لذلك نأتي إليه ونحن خطاة ونخرج مقبولين."},"13":{"14":"البركة تجمع نعمة الرب يسوع ومحبة الله وشركة الروح القدس. الثلاثة في عمل واحد للخلاص والشركة، وهم ليسوا ثلاثة آلهة. النعمة تُذكر أولًا لأنها أساس الحياة المسيحية لا أجر الأعمال. هذه البركة لكل الكنيسة، وهي تعلمنا أن نعبد الإله الواحد كما أعلن نفسه."}},"gal":{"1":{"8":"حتى لو بشر بولس نفسه أو ملاك من السماء بإنجيل آخر فهو تحت اللعنة. المرجع ليس رؤيا جديدة ولا تقليدًا يبدل البشارة، بل الإنجيل الذي سُلم في الكتاب. إنجيل آخر غالبًا يُدخل الأعمال أو وسيطًا غير المسيح. نتمسك بما كُتب، فالكتاب فوق كل صوت."},"2":{"16":"الإنسان لا يتبرر بأعمال الناموس بل بإيمان يسوع المسيح. بولس يعيد الجملة حتى لا تُخلط: بأعمال الناموس لا يتبرر جسد ما. الإيمان هنا الثقة بالمسيح لا مجرد موافقة ذهنية، وهو مفتوح لكل من يسمع. الطاعة تتبع التبرير ولا تكون ثمنه."},"3":{"27":"الذين اعتمدوا بالمسيح قد لبسوا المسيح، أي أُعلن اتحادهم به. ليس المعنى أن الماء يلبس الإنسان بر المسيح من غير إيمان. الرسالة كلها تقول إن التبرير بالإيمان لا بأعمال الناموس. من اعتمد مؤمنًا يعلن أمام الناس أنه صار للمسيح ويعيش هذا اللبس."},"5":{"4":"من يطلب التبرير بالناموس ينفصل عن المسيح طريقًا للبر، ويسقط من مبدأ النعمة. ليس المعنى أن الأعمال الصالحة خطر، بل أن الاتكال عليها للقبول عند الله يبطل الاتكال على الصليب. النعمة تبقى نعمة إن كان الرجاء كله في المسيح. المؤمن يثبت في هذه النعمة ويطيع عن حب لا عن ثمن."}},"eph":{"2":{"8":"الخلاص بالنعمة، بالإيمان، وهذا ليس منا بل عطية الله. حتى الإيمان ليس مفخرة نصنعها بمعزل عن عطيته. الآية تغلق باب الاستحقاق: لا نقول إن الله أدى لنا لأننا آمنا بقوتنا. نقبل العطية ونحمد المعطي.","9":"الخلاص ليس من الأعمال كيلا يفتخر أحد. لو كانت الأعمال جزءًا من الثمن لصار للمخلَّص فضل على النعمة. الأعمال الصالحة تأتي في الآية التالية ثمرًا لمن خُلق في المسيح، لا سلمًا يصعد به. الافتخار كله للرب."},"4":{"5":"رب واحد وإيمان واحد ومعمودية واحدة تجمع الكنيسة. المعمودية الواحدة هي معمودية الذين آمنوا بهذا الرب، باسم الآب والابن والروح، شهادة للاتحاد بالمسيح. ليست طقوسًا كثيرة تُدخل إلى الله، ولا معمودية تغني عن الإيمان. جسد المسيح يجمع كل الأمم حول هذا الرب الواحد."},"5":{"31":"بولس يعود إلى كلمة الخليقة: يترك الرجل أباه وأمه ويلتصق بامرأته ويكونان جسدًا واحدًا. الزواج هنا رجل وامرأة، عهد واحد لا شراكة تُعاد تعريفها. ثم يجعل بولس هذا صورة لمحبة المسيح للكنيسة، فالمسيح هو العريس والأمين. نكرم الزواج كما رسمه الله، ونأخذ منه أيضًا معنى أمانة المسيح لشعبه."}},"php":{"2":{"6":"المسيح كان في صورة الله، أي في مقام الله نفسه، ولم يحسب هذه المساواة غنيمة يمسك بها لأجل نفسه. أخلى نفسه آخذًا صورة عبد، من غير أن يكف عن كونه الله. التواضع أنه صار إنسانًا وأطاع إلى الصليب. نسجد لهذا الرب المتواضع، وخلاصنا من تنازله لا من أعمالنا."}},"col":{"1":{"15":"المسيح صورة الله غير المنظور، فمن رآه فقد رأى ما يُعلن عن الله. «بكر كل خليقة» لا تعني أنه أول مخلوق، فالآية التالية تقول إن الكل به خُلق وإنه قبل كل شيء. البكر هنا صاحب الرتبة والميراث على الخليقة. فهو الخالق الذي به نُقلنا إلى الملكوت، لا كائنًا وسطًا بين الله والبشر."},"2":{"12":"المعمودية دفن مع المسيح وقيامة معه. هذا يقوم بإيمان عمل الله الذي أقام يسوع، لا بفعل الماء وحده. من يعتمد وهو مؤمن يعلن أنه مات عن الحياة القديمة ليحيا مع المسيح. صورة الدفن تناسب الغمر، وهي تتبع الإيمان ولا تحل مكانه."}},"1ti":{"2":{"4":"الله يريد أن جميع الناس يخلصون وإلى معرفة الحق يقبلون. هذه الإرادة تظهر في البشارة الموجهة إلى الجميع لا إلى فئة مغلقة. كلام الكتاب عن اختيار الله لا يُستعمل لإلغاء هذه الدعوة الصادقة. نصلي ونذهب لأن الله يريد أن تسمع الأمم الحق وتخلص بالإيمان.","5":"يوجد إله واحد، فلا آلهة كثيرة ولا طرق كثيرة. ويوجد وسيط واحد بين الله والناس: الإنسان يسوع المسيح. لا وسيط من القديسين يُضاف، ولا كاهن يكمل ما ينقص وساطته. لأنه إنسان فهو قريب منا، ولأنه الرب الوسيط فكفارته كافية لكل من يأتي."}},"tit":{"3":{"5":"الله خلصنا لا بسبب أعمال بر عملناها بل برحمته. غسل الميلاد الثاني وتجديد الروح هو عمل الروح القدس في القلب، لا ماء المعمودية بوصفه طقسًا يخلّص. المعمودية ترسم هذا الميلاد لمن آمن، أما الميلاد نفسه فعطية الروح. الرجاء في رحمة الله لا في عمل أيديناه."}},"heb":{"1":{"8":"الكاتب يوجه إلى الابن كلامًا يقول: كرسيك يا الله إلى دهر الدهور. الابن يُخاطب إلهًا، لا مخلوقًا رفيعًا فقط. هذا يوافق سجود الكنيسة له مع بقاء الإله واحدًا. ملكه دائم، فالملكوت ليس عطية نشتريها بأعمالنا."},"6":{"6":"الكلام عن أناس ذاقوا خير الله ثم سقطوا برفض المسيح علانية، حتى صاروا كأنهم يصلبونه ثانية. لا توجد ذبيحة أخرى يُرجع إليها من رفض الذبيحة الواحدة. التحذير جاد حتى لا نلعب بالإنجيل. أما من وُلد من الله حقًا فالمسيح يمسكه، والسقوط النهائي يظهر أن التعلق كان بالخارج لا بالإيمان المخلّص."},"9":{"12":"المسيح دخل الأقداس مرة واحدة بدم نفسه لا بدم حيوانات، فوجد فداء أبديًا. مرة واحدة تعني أن الفداء لا يُعاد ولا يُكمَّل بذبائح لاحقة. الكاهن والذبيحة هما المسيح نفسه. المؤمن يستريح في فداء تم، ويقترب إلى الله بثقة لا برصيد أعمال.","27":"وُضع للناس أن يموتوا مرة ثم الدينونة. لا دورة حياة أخرى نكمل فيها الاستحقاق، ولا مكان بعد الموت نُنهي فيه دفع ثمن الخطية. لذلك نُصلح أمرنا الآن بالإيمان بالمسيح. الدينونة حق، والنجاة منها في ذبيحته الواحدة لا في أعمال تُستأنف بعد الموت."},"10":{"12":"بعدما قدم المسيح عن الخطايا ذبيحة واحدة جلس إلى الأبد. الجلوس علامة أن العمل اكتمل، بخلاف الكهنة الذين يقفون كل يوم. لا نعيد تقديمه ذبيحة على مائدة أو مذبح. نذكر ذبيحته بالإيمان والشكر، والمغفرة قائمة على ما أتمه هو."}},"jas":{"2":{"24":"يعقوب لا يناقض بولس. بولس يبين أن الله يبرر الفاجر بالإيمان من غير أعمال تشتري الغفران. يعقوب يبين أن الإيمان الذي بلا أعمال ميت، ولا يبرر صاحبه في الامتحان الحقيقي. الأعمال ثمر الإيمان ودليله أمام الناس لا أساس الخلاص. نخلص بالنعمة، والإيمان الحي يمشي."}},"1pe":{"3":{"21":"بطرس يقول إن المعمودية تخلّص بوصفها مثالًا، ثم يفسر: لا بإزالة وسخ الجسد. المقصود سؤال ضمير صالح أمام الله، أي جواب الإيمان، بقوة قيامة يسوع المسيح. الماء لا يغسل الخطية كما يغسل التراب. الذي يخلّص هو المسيح القائم، والإيمان به، والمعمودية شهادة هذا الضمير."}},"1jn":{"2":{"2":"المسيح كفارة لخطايانا، وليس لخطايانا فقط بل لخطايا كل العالم أيضًا. الكفارة كافية لكل الشعوب لا لطائفة واحدة، والدعوة مفتوحة. هذا لا يعني أن كل إنسان يخلص بلا إيمان، فالرسالة تطلب الإيمان بالابن. بل يعني أن لا أحد يُرد لأنه من أمة أخرى، ومن جاء بالإيمان يجد كفارة تامة."},"5":{"7":"الآية كما هي أمامنا تقول إن الآب والكلمة والروح القدس واحد، وهذا هو إيمان الكنيسة بإله واحد لا بثلاثة آلهة. ويجدر أن نعلم أن هذه الجملة ليست في كثير من المخطوطات القديمة، فلا نعلق كل الحق عليها وحدها. إعلان الآب والابن والروح واضح في مواضع راسخة مثل معمودية يسوع وإرسال التلاميذ والبركة الختامية. نتمسك بالكتاب كله، ونعبد الإله الواحد كما أعلن نفسه.","13":"يوحنا يكتب للمؤمنين باسم ابن الله لكي يعلموا أن لهم حياة أبدية. المعرفة هنا يقين وعد الله لا غرور. الحياة الأبدية لمن يؤمن بالابن الآن، لا جائزة تُخفى حتى نزن الأعمال. من صدق شهادة الله عن ابنه يقدر أن يقول باتضاع: لي حياة أبدية بالنعمة."}},"2pe":{"1":{"20":"قوله إن نبوة الكتاب ليست من تفسير خاص يعني أنها لم تخرج من رأي النبي الخاص. الآية التالية تفسر: تكلم أناس الله مسوقين بالروح القدس. ليس المعنى أن المؤمن لا يفهم الكتاب إلا إذا فسرته له جهة واحدة فوق الكلمة. الكتاب كلمة الله، وهو المرجع الأخير فوق كل تقليد."},"3":{"9":"الرب لا يتباطأ عن وعده كما يظن بعض الناس. يتأنى لأنه لا يشاء أن يهلك أناس بل أن يقبل الجميع إلى التوبة. باب التوبة مفتوح اليوم، والخلاص بالنعمة لكل من يرجع بالإيمان. هذا يدعونا إلى الصبر وإلى الكرازة، لا إلى تأجيل التوبة."}},"jud":{"1":{"3":"يهوذا يحث المؤمنين أن يجاهدوا لأجل الإيمان الذي سُلم مرة واحدة للقديسين. الإيمان هنا محتوى البشارة المسلَّمة، لا شعور يتبدل مع الزمان. لا نقبل إنجيلًا جديدًا يضيف وسيطًا أو يجعل الأعمال ثمنًا للخلاص. الجهاد لأجله هو التمسك بالكتاب والرحمة مع الثبات."}},"rev":{"5":{"9":"الخروف ذُبح واشترى لله بدمه أناسًا من كل قبيلة ولسان وشعب وأمة. الشراء بدمه لا بأعمالهم ولا بانتمائهم. السماء ستجمع كل الأمم حول المسيح، فالإنجيل لكل إنسان اليوم. نستحق أن نذهب بهذا الخبر لا أن نحبسه في شعب واحد."},"22":{"17":"الروح والعروس يقولان تعال، ومن يعطش فليأتِ، ومن يرد فليأخذ ماء حياة مجانًا. الماء مجاني، فلا يُباع بعمل أو بطقس. الدعوة لمن يسمع ويريد، وهي مفتوحة لا مغلقة على خاصة. من عطش إلى الحياة فليأتِ إلى المسيح الآن بالإيمان."}},"gen":{"1":{"1":"في البداية خلق الله السماء والأرض، فالعالم ليس أزليًا ولا وليد صدفة تُعبد. الله هو الأول، وكلمته هي التي تخبرنا بهذا، فهي المرجع لا ظنون الناس. الخليقة كلها له، والإنسان مسؤول أمامه. من هنا يبدأ الكتاب، ومن هنا نفهم من نحن.","26":"قول الله «لنصنع الإنسان على صورتنا» يكشف غنى في الله الواحد، لا آلهة كثيرة. مع إعلان أن الرب إله واحد نفهم أن هذا الغنى تم في الآب والابن والروح، من غير أن نفصلهم ثلاثة آلهة. الإنسان على صورة الله، فكرامته من الخالق لا من قوته. والتسلط على الأرض أمانة لا إذن بتدمير حياة الإنسان.","27":"الله خلق الإنسان على صورته، ذكرًا وأنثى خلقهم. الذكر والأنثى معًا يحملان الصورة، فلا يُحتقر أحدهما، وتمييزهما من الخالق لا من العادة فقط. هذا أصل الزواج والعائلة في الكتاب. نقبل ما قاله الله عن الإنسان، فالكتاب فوق آرائنا."},"2":{"24":"الرجل يترك أباه وأمه ويلتصق بامرأته ويكونان جسدًا واحدًا. الزواج في البدء عهد بين رجل واحد وامرأة واحدة، علنيًا ودائمًا. يسوع عاد إلى هذه الآية حين سُئل عن الطلاق. نكرم هذا العهد كما رسمه الله، ونرحم الجرحى من غير أن نبدل التصميم."},"3":{"15":"بعد السقوط يعد الله بنسل من المرأة يسحق رأس الحية، والحية تسحق عقبه. هذا أول وعد بالذي يغلب الشر بثمن، وهو يتحقق في يسوع ومولده وصلبه وقيامته. نسل المرأة هو المخلص، لا أمّه شريكة في الفداء. مريم مكرمة لأنها ولدت الرب، والرجاء في ابنها وحده."},"9":{"6":"من يسفك دم الإنسان يُحاسب، لأن الله عمل الإنسان على صورته. حرمة الدم قائمة على صورة الله لا على سن أو قوة أو منفعة. لذلك حياة الإنسان ليست ملكًا نهدره. هذا الإكرام يشمل الضعيف ومن لم يولد بعد، فالصورة عطية الخالق لا مكتسب نؤجله."},"12":{"3":"الله يعد إبراهيم أن تتبارك فيه جميع قبائل الأرض. البركة ليست حبيسة شعب واحد، فقصد الله من البدء أن تصل رحمته إلى كل العائلات. تمام الوعد في نسله المسيح، كما يشرح العهد الجديد. لذلك الإنجيل لكل أمة، والبركة تُنال بالإيمان لا بالانتساب الجسدي وحده."},"15":{"6":"آمن إبراهيم بالرب فحسبه له برًا. هذا قبل الختان وقبل الشريعة، فالحسبان بالثقة بوعد الله لا بأعمال تشتري القبول. بولس يعود إلى هذه الآية ليبين أن التبرير بالإيمان. مثال إبراهيم مفتوح لكل من يؤمن بالمسيح، من أي شعب."}},"exo":{"3":{"14":"الله يقول لموسى: أهيه الذي أهيه، أي الكائن الذي لا يُحد بغيره. هذا اسمه الذي أرسل به موسى، وهو ليس لقبًا يُعار لمخلوق. حين قال يسوع قبل إبراهيم «أنا كائن» نسب إلى نفسه هذا الحضور الإلهي. نعبد هذا الرب كما أعلن نفسه في الكتاب، لا كما نتخيله."},"12":{"13":"الدم على البيوت علامة، والرب يقول: أرى الدم وأعبر عنكم. النجاة لم تكن لأن الساكنين أفضل، بل لأنهم احتموا تحت الدم الذي أمر به الله. هذه الفدية ظل لدم المسيح الذي يُنجي من الدينونة كل من يؤمن. العلامة لا تنفع بلا ثقة بما قاله الرب."},"20":{"13":"«لا تقتل» تحمي حياة الإنسان الذي على صورة الله. الوصية تمنع قتل النفس البريئة، ولا تجعل كل إزهاق في القضاء أو الدفاع مثل قتل العدوان. الطفل في البطن نفس إنسانية الله ينسجها، فحرمة الحياة تشمله. نطيع الوصية لأن الكلمة من الله لا من ذوق المجتمع."},"21":{"22":"الشريعة تتكلم عن أذى يصيب امرأة حبلى وعن ولدها، فإن وقعت أذية فالقصاص يصل إلى نفس بنفس. الولد في البطن داخل في عدل الله لا مهمل كأنه شيء. ومع المزمور الذي يقول إن الله ينسج الإنسان في بطن أمه، نؤمن أن الجنين نفس بشرية لها حرمة. نحفظ هذه الحياة ولا نعاملها كملك نتصرف فيه بلا حساب."}},"lev":{"17":{"11":"الرب يقول إن النفس في الدم، وإنه أعطى الدم على المذبح للتكفير. التكفير من عطية الله لا من شعور المتقرب. دم الحيوانات كان ظلًا يشير إلى دم المسيح الذي يكفر مرة واحدة. لا كفارة اليوم بغير ذلك الدم، والإيمان هو أخذ هذه العطية."}},"deu":{"6":{"4":"الرب إلهنا رب واحد. هذا يمنع تعدد الآلهة، ويمنع أن نجعل الابن أو الروح إلهًا منفصلًا عن الإله الواحد. حين يعلن العهد الجديد الآب والابن والروح فهو لا ينقض هذه الآية، بل يظهر غنى الإله الواحد. نعبد ربًا واحدًا، ونرفض كل شريك في ألوهيته."}},"psa":{"22":{"1":"افتتاح المزمور صرخة متروك: إلهي إلهي لماذا تركتني. يسوع صلى هذا على الصليب، فالمزمور يبلغ تمامه في آلامه لا في داود وحده. الترك هنا حمل الدينونة لأجل الخطاة، لا انفصالًا في جوهر الله. من هذا الألم جاء الرجاء، لأن المتروك هو الذي يخلص المتكلين."},"51":{"5":"داود يقول إنه بذنب وُلد وفي حمل أمه حُمل به. ليس المقصود اتهام أمه، بل أن الخطية ساكنة فينا منذ البداية لا من أخطاء كبيرة فقط. لذلك لا يكفي إصلاح الظاهر، بل نحتاج ميلادًا من فوق. الرجاء ليس في طهارة أصلنا بل في غفران الله وتجديده."},"110":{"1":"الرب يقول لسيد داود: اجلس عن يميني. داود يدعو ابنه الموعود سيده، فالمسيح أعظم من أن يكون ملكًا بشريًا فقط. يسوع استعمل هذه الآية ليبين مقامه. الجلوس عن اليمين كرامة إلهية، والسجود له حق لأنه الرب لا مجرد قدوة."},"139":{"13":"المصلى يقول لله: أنت كونت كليتي ونسجتني في بطن أمي. الجنين في الرحم شخص يصنعه الله ويرى أيامه، لا جزءًا بلا اسم من جسد أمه. لذلك كرامته كرامة إنسان على صورة الله منذ هناك. نحفظ حياة من لم يولد، ونحمد الخالق على هذه العناية."}},"isa":{"7":{"14":"الآية تعطي آحاز علامة: الفتاة تحمل وتلد ابنًا يُدعى عمانوئيل، وقبل أن يميز الصبي الخير من الشر يفرج الرب عن يهوذا. هذا المعنى القريب لا يُلغى من سياق الأصحاح. ومتى، بالروح، يعلن المعنى الأكمل: العذراء تحبل بعمل الروح، والمولود هو الله معنا. نقبل كلام النبي وتفسير الإنجيل معًا، والمسيح هو عمانوئيل."},"9":{"6":"الولد الذي يُولد يُدعى إلهًا جبارًا، فهو ليس ملكًا بشريًا فقط. لقب أب أبدي يصف رعايته التي لا تنتهي لشعبه، ولا يعني أن الابن هو الآب نفسه بلا تمييز. الآب والابن واحد في الإله الواحد، ومتميزان في شخصيهما. هذا الطفل هو رئيس السلام، وسلامنا معه بالإيمان لا بالأعمال."},"45":{"22":"الرب يقول: التفتوا إلي واخلصوا يا كل أقاصي الأرض، لأني أنا الله وليس آخر. الخلاص بالتفات إلى الله نفسه لا إلى وسيط من صنعنا، وهو معروض على أقاصي الأرض. ليس إله آخر لشعب آخر. تمام هذا الالتفات في المسيح الذي هو الطريق الوحيد إلى الآب."},"53":{"5":"العبد مجروح من معاصينا لا من قصاص استحقه هو. تأديب سلامنا عليه، وبجراحه بُرئ لنا، فالشفاء والغفران من ضربه نيابة. تمام الكلام ليس في أمة خاطئة تحمل نفسها، بل في البار الذي حمل إثم غيره. العهد الجديد يريه في يسوع الذي صُلب لأجل الخطاة.","6":"كلنا كالغنم ضللنا، كل واحد إلى طريقه. ثم الرب نفسه أوقع عليه إثم كلنا، فالحمل من تدبير الله لا من مصادفة. الضلال عام، فلا يخلص إنسان ببراءته. الرجاء أن الإثم وُضع على العبد البار، ومن يؤمن به لا يحمل دينونته وحده.","11":"من تعب نفسه يرى ويشبع، وبعرفته يبرر البار كثيرين، وآثامهم هو يحمل. التبرير هنا بمعرفة هذا العبد، أي بالثقة به، وهو يحمل الإثم. كثيرون لا تعني أن الباب مغلق على الباقين، فدعوة الله تبلغ الأمم ومن يؤمن يُبرر. العبد هو المسيح، وبره يُحسب لمن يعرفه بالإيمان."}},"jer":{"1":{"5":"الرب عرف إرميا وقدسه قبل أن يخرج من الرحم، وجعله نبيًا للأمم. هذا عن دعوة إرميا، ويظهر معه أن الطفل في البطن شخص يعرفه الله لا شيء بلا حرمة. الحياة الإنسانية تبدأ تحت نظر الله قبل الولادة. نكرم هذه الحياة، ونتذكر أيضًا أن الله يرسل كلمته إلى الأمم."},"31":{"31":"الرب يعد بعهد جديد مع شعبه، غير العهد الذي نقضوه. الجديد ليس شريعة أثقل تُفرض على الخارج، بل عمل الله في القلب كما تشرح الآية بعد قليل. يسوع قال إن كأسه هي هذا العهد الجديد بدمه. فالعهد نعمة مختومة بموته، ويُدخل إليه بالإيمان لا بأعمال تكمل الفداء."}},"ezk":{"36":{"26":"الله هو الذي يعطي قلبًا جديدًا وروحًا جديدة وينزع قلب الحجر. التجديد من وعده لا من قرار الإنسان أن يصلح نفسه وحده. هذا هو الميلاد الذي تكلم عنه يسوع: عمل الروح في الداخل. التوبة والإيمان جواب على هذا العمل، لا ثمن يُدفع ليحصل."}},"dan":{"7":{"13":"دانيال يرى مع سحب السماء مثل ابن إنسان يأتي إلى عتيق الأيام. ابن الإنسان هنا ملك سماوي يُقدم أمام الله، لا مجرد إنسان ضعيف. يسوع اتخذ هذا اللقب لنفسه وتكلم عن مجيئه على السحاب. الرؤيا تعد بالذي له مقام في السماء، وهو المسيح الديان والملك.","14":"أُعطي لابن الإنسان سلطان وملك، وكل الشعوب والأمم والألسنة إياه يعبدون. العبادة حق لله وحده، فهذه الآية تعلن مقامًا إلهيًا لهذا الملك. ملكوته لا يزول ولا يفسد، وهو يشمل كل الألسنة لا شعبًا واحدًا. نسجد للمسيح ونبشر كل أمة به، فالملكوت عطيته لا صنع أيدينا."}},"mic":{"5":{"2":"من بيت لحم الصغيرة يخرج متسلط على إسرائيل، ومخارجه منذ القديم منذ أيام الأزل. المولود في بيت لحم ليس بدؤه هناك، فأصوله أزلية. هذا يلتقي بمولد يسوع وبالإعلان أنه كان في البدء. الملك الموعود هو الرب نفسه الذي صار إنسانًا، ورجاؤنا فيه."}},"zec":{"12":{"10":"الرب يقول إنهم سينظرون إليه هو الذي طعنوه وينوحون عليه. المتكلم هو الله، والطعن وقع عليه، فالنص يشير إلى تجسد يأتي فيه الرب ويُطعن. يوحنا يرى تمام هذا في المصلوب. النوح توبة، والروح المسكوب نعمة، والخلاص لمن ينظر إلى المطعون بالإيمان."}},"hab":{"2":{"4":"مقابل المنتفخ بنفسه، البار بإيمانه يحيا. الحياة أمام الله بالثقة به لا بالاعتداد بالنفس أو بالأعمال. بولس ويوحنا الرسولي يأخذان هذه الكلمة ليعلنا أن البر بالإيمان. الآية تواضع كل متكبر وتفتح الحياة لكل من يؤمن بوعد الله، وتمام الوعد في المسيح."}}};</script>
